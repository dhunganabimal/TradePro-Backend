databases:
  - name: trade_db
    databaseName: trade_db
    plan: free
    ipAllowList: []

services:
  - type: web
    name: fastapi-tutorial
    runtime: python
    plan: free
    buildCommand: "pip install uv && uv sync"
    startCommand: "uv run uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

      - key: DATABASE_URL
        fromDatabase:
          name: trade_db
          property: connectionString

      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
